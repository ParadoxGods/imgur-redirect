<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#091114">
    <meta name="referrer" content="no-referrer">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://camo.githubusercontent.com https://i.imgur.com; connect-src https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests"
    >
    <meta name="description" content="View a direct Imgur image or GIF through GitHub Camo.">
    <title>Imgur Portal</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page">
      <form id="portal-form" class="prompt" novalidate>
        <label for="imgur-url">insert imgur url here:</label>
        <div class="input-row">
          <input
            id="imgur-url"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="none"
            enterkeyhint="go"
            spellcheck="false"
            maxlength="2048"
            aria-describedby="form-help"
            aria-errormessage="error-message"
            aria-invalid="false"
            required
          >
          <button id="submit-button" class="primary-action" type="submit">view</button>
        </div>
        <p id="form-help" class="visually-hidden">Enter a direct i.imgur.com image or GIF URL, or a simple imgur.com image link.</p>
        <button id="example-button" type="button" hidden>use example</button>
      </form>

      <section id="viewer" class="viewer" aria-labelledby="viewer-title" aria-busy="false" hidden>
        <h1 id="viewer-title" class="visually-hidden">image viewer</h1>
        <span id="relay-badge" class="status" role="status" aria-live="polite" aria-atomic="true">preparing relay</span>

        <div id="loading-panel" class="message-panel">
          <p>loading...</p>
          <p id="loading-source" class="source"></p>
        </div>

        <div id="media-panel" hidden>
          <a id="image-link" class="image-stage" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open the displayed image in a new tab">
            <img id="media-image" alt="" decoding="async" referrerpolicy="no-referrer">
            <span id="animation-hidden" class="animation-hidden" hidden>GIF hidden — opening may animate</span>
          </a>
          <div class="media-meta">
            <span id="media-dimensions"></span>
            <p id="canonical-source" class="source"></p>
            <div class="actions">
              <button id="share-link" class="primary-action" type="button" hidden>share</button>
              <button id="copy-link" type="button" aria-live="polite">copy link</button>
              <button id="toggle-animation" type="button" hidden>hide GIF</button>
              <a id="open-relay" href="#" target="_blank" rel="noopener noreferrer">open image</a>
            </div>
          </div>
        </div>

        <div id="error-panel" class="message-panel error" role="alert" hidden>
          <h2 id="error-title">could not load image</h2>
          <p id="error-message"></p>
          <div class="actions">
            <button id="retry-relay" type="button">retry</button>
            <button id="try-direct" type="button">try direct (contacts imgur)</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
